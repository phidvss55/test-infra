apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  labels:
    app: vue-application-deployment-description-long-here
  namespace: demo-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-app

  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      securityContext:
        runAsUser: 0

      containers:
        - name: frontend-app-container
          image: phidinh/vue-app:v2
          ports:
            - containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          securityContext:
            allowPrivilegeEscalation: false
