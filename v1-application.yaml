apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: project-2
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  destinations:
    - namespace: "*"
      server: "*"
  sourceRepos:
    # - "!https://github.com/phidvss55/test-infra.git"
    - "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-2-vue-app
  namespace: argocd

spec:
  project: project-2

  destination:
    namespace: demo-app
    server: "https://kubernetes.default.svc"

  source:
    path: client-app
    repoURL: "https://github.com/phidvss55/test-infra.git"
    targetRevision: HEAD

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
